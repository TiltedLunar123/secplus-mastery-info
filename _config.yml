title: SecPlus Mastery
description: Mastery-based study platform for the CompTIA Security+ SY0-701 exam, with section gates, spaced repetition, and a timed mock exam.
theme: jekyll-theme-cayman
url: https://tiltedlunar123.github.io
baseurl: /secplus-mastery-info
repository: TiltedLunar123/secplus-mastery-info

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

author:
  name: Jude Hilgendorf
  email: support@secplusmastery.com

# Consumed by jekyll-seo-tag to produce Open Graph and Twitter card
# metadata on every page.
social:
  name: SecPlus Mastery
  links:
    - https://secplusmastery.com

twitter:
  card: summary

lang: en

# Keep repo-meta files out of the published site. Setting exclude here
# replaces Jekyll's built-in list rather than extending it, so the usual
# vendor and bundler entries are repeated below alongside the additions.
# Without this, LICENSE, SECURITY.md, and CONTRIBUTING.md would be copied
# to the site root and served as raw files.
exclude:
  - Gemfile
  - Gemfile.lock
  - .bundle
  - vendor
  - .jekyll-cache
  - .sass-cache
  - LICENSE
  - SECURITY.md
  - CONTRIBUTING.md
  - PLAN_TODAY.md
